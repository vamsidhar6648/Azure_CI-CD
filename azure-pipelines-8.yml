trigger: none  # Manual trigger only

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: Module
    displayName: "Select Test"
    type: string
    default: "loginTest.spec.ts"
    values:
      - "loginTest.spec.ts"
      - "pim.spec.ts"

  - name: Browser
    displayName: "Select Browser"
    type: string
    default: "Chromium"
    values:
      - "Chromium"
      - "Firefox"
      - "Edge"

stages:
- stage: Trigger_Jenkins
  displayName: "Trigger Jenkins Job"
  jobs:
  - job: TriggerJob
    displayName: "Call Jenkins Job via curl"
    steps:
    - task: Bash@3
      displayName: "Trigger Jenkins Job"
      inputs:
        targetType: 'inline'
        script: |
          # Set Jenkins details
          JENKINS_URL="https://3943-183-82-115-164.ngrok-free.app"
          JOB_NAME="Jenkins_With_ADO"
          TOKEN="11a575a43f6719cd829522c842d633500f"

          # Parameters from ADO
          MODULE="${{ parameters.Module }}"
          BROWSER="${{ parameters.Browser }}"

          # Build full trigger URL
          FINAL_URL="$JENKINS_URL/job/$JOB_NAME/buildWithParameters?token=$TOKEN&Module=$MODULE&Browser=$BROWSER"

          echo "Triggering Jenkins Job with:"
          echo "  Module: $MODULE"
          echo "  Browser: $BROWSER"
          echo "  URL: $FINAL_URL"

          # Trigger Jenkins job
          curl -X POST "$FINAL_URL"
