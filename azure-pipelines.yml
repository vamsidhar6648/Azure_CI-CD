trigger: none 

pool:
  vmImage: ubuntu-latest

parameters:
  - name: Module
    displayName: 'Select the test'
    type: string
    default: loginTest.spec.ts
    values:
      - loginTest.spec.ts
      - pimTest.spec.ts
      - adminTest.spec.ts

  - name: Browser
    displayName: 'Select the browser'
    type: string
    default: chrome
    values:
      - chrome
      - firefox
      - safari

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18'
  displayName: 'Install Node.js'
- script: npm ci
  displayName: 'npm ci'
- script: npx playwright install --with-deps
  displayName: 'Install Playwright browsers'
- script: npx playwright test ./${{ parameters.Module }} --project=${{ parameters.Browser }} 
  displayName: 'Run Playwright tests'