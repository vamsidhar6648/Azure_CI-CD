trigger: none    # No CI trigger on push — this is purely scheduled

schedules:
  - cron: "30 21 * * *"               # 3:00 AM IST = 9:30 PM UTC
    displayName: Daily Smoke Run
    branches:
      include:
        - main
    always: true                      # Run even if no code changes

pool:
  vmImage: 'ubuntu-latest'            # Microsoft-hosted Linux agent

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'

  - script: npm ci
    displayName: 'Install Dependencies'

  - script: npx playwright install --with-deps
    displayName: 'Install Playwright Browsers'

  - script: npx playwright test --grep @smoke --project=chromium
    displayName: 'Run Smoke Tests on Chromium'

  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/test-results/**/*.xml'   # Customize if you export JUnit XML
      testRunTitle: 'Scheduled Smoke Tests'
    condition: succeededOrFailed()                   # Upload results even on failure
