trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: Module
    displayName: "Select Test"
    type: string
    default: "loginTest.spec.ts"
    values:
      - "loginTest.spec.ts"
      - "pim.spec.ts"

steps:
- script: |
    curl -v -X POST "https://<ngrok-url>/job/Playwright_Node_CI/buildWithParameters?MODULE=tests/$(Module)&token=triggerado" \
    --user "vamsi:<jenkins-api-token>"
  displayName: "Trigger Jenkins Git-based Pipeline"
